name: Build iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Expo template and inject App.js
        run: |
          npx create-expo-app@latest MyTempApp --template blank --yes
          cp App.js MyTempApp/App.js
          cd MyTempApp
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.name = "MyTempApp";
            cfg.expo.slug = "mytempapp";
            cfg.expo.ios = { ...(cfg.expo.ios || {}), bundleIdentifier: "com.timberlines.app" };
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
          '
          CI=1 npx expo prebuild --platform ios --no-install
          ls -la ios

      - name: Build .app for iOS Simulator
        run: |
          cd MyTempApp
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload .app for Appetize
        uses: actions/upload-artifact@v4
        with:
          name: MyiPhoneApp
          path: MyTempApp/build/Build/Products/Release-iphonesimulator/*.app
