name: Build iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Expo template and inject App.js
        run: |
          npx create-expo-app@latest MyTempApp --template blank --yes
          cp App.js MyTempApp/App.js
          cd MyTempApp
          npx expo install react-native-reanimated
          npx expo prebuild --platform ios --no-install

      - name: Build .app for iOS Simulator
        run: |
          cd MyTempApp
          xcodebuild \
            -workspace ios/MyTempApp.xcworkspace \
            -scheme MyTempApp \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload .app for Appetize
        uses: actions/upload-artifact@v4
        with:
          name: MyiPhoneApp
          path: MyTempApp/build/Build/Products/Release-iphonesimulator/MyTempApp.app
